[tool.ruff]
exclude = [
    "services/hotel_ranking_service.py"
]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "F403", "F405", "E701", "E722"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
explicit_package_bases = true
disable_error_code = [
    "attr-defined",
    "no-any-return"
]

[[tool.mypy.overrides]]
module = "services.hotel_ranking_service"
ignore_errors = true

[[tool.mypy.overrides]]
module = "services.collection_service"
ignore_errors = true

[[tool.mypy.overrides]]
module = "services.summary_service"
ignore_errors = true